apply plugin: 'com.android.application'

// 배포용 서명: 키와 비밀번호는 저장소 밖 파일에서 읽음 (mobile/RELEASE.md). 없으면 배포용 빌드가 멈춤 (checkReleaseConfig)
def keystoreFile = file(System.getenv('FD_KEYSTORE_PROPERTIES') ?: "${rootDir}/keystore.properties")
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace = "com.humanfall.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.humanfall.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 새 버전을 낼 때: gradlew assembleRelease -PfdVersionCode=2 -PfdVersionName=1.1
        versionCode((project.findProperty('fdVersionCode') ?: 1) as int)
        versionName((project.findProperty('fdVersionName') ?: '1.0') as String)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystore.storeFile) {
                storeFile file(keystore.storeFile)
                storePassword keystore.storePassword
                keyAlias keystore.keyAlias
                keyPassword keystore.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (keystore.storeFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true   // BuildConfig.DEBUG: 에뮬레이터 시험용 사진 입력은 debug 빌드에서만
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // MediaPipe 는 모델 파일을 압축되지 않은 상태로 읽어야 함
    androidResources {
        noCompress += ['task', 'tflite']
    }
    // 자세 인식 모델은 Git 에 넣지 않고 빌드할 때 받아서 넣음 (아래 downloadPoseModel)
    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/poseModel"
        // debug 빌드만: 개발용 네트워크 설정 (아래 debugNetworkConfig). release 에는 들어가지 않음
        debug.res.srcDirs += "$buildDir/generated/debugNetworkConfig/res"
    }
}

// debug 빌드의 네트워크 설정 (release 빌드는 Android 기본값: HTTP 금지, 시스템 인증서만 믿음).
//  - PC 의 시험 서버에 HTTP 로 접속 허용: localhost·127.0.0.1(adb reverse), 10.0.2.2(에뮬레이터에서 본 PC)
//  - 로컬 HTTPS 시험: tools/dev_tls.py 가 만든 개발용 CA(프로젝트 밖)가 이 PC 에 있으면, 위 주소에서만 그 CA 도 믿음.
//    인증서 검사를 끄거나 모든 인증서를 믿는 설정은 쓰지 않음
def devCaFile = file("${System.getenv('LOCALAPPDATA') ?: System.getProperty('user.home')}/FallDetection/dev-tls/ca.pem")
def debugNetworkDir = file("$buildDir/generated/debugNetworkConfig/res")
tasks.register('debugNetworkConfig') {
    inputs.property('devCa', devCaFile.exists() ? devCaFile.text : '')
    outputs.dir(debugNetworkDir)
    doLast {
        delete debugNetworkDir
        def xml = new File(debugNetworkDir, 'xml/network_security_config.xml')
        xml.parentFile.mkdirs()
        def anchors = ''
        if (devCaFile.exists()) {
            def raw = new File(debugNetworkDir, 'raw/fd_dev_ca.pem')
            raw.parentFile.mkdirs()
            raw.text = devCaFile.text
            anchors = '''
        <trust-anchors>
            <certificates src="system" />
            <certificates src="@raw/fd_dev_ca" />
        </trust-anchors>'''
            logger.lifecycle("debug 빌드: 로컬 HTTPS 시험용 개발 CA 를 localhost 에서만 믿음 ($devCaFile)")
        }
        xml.text = """<?xml version="1.0" encoding="utf-8"?>
<!-- 빌드할 때 만들어짐 (app/build.gradle 의 debugNetworkConfig). debug 빌드 전용 -->
<network-security-config>
    <domain-config cleartextTrafficPermitted="true">
        <domain includeSubdomains="false">localhost</domain>
        <domain includeSubdomains="false">127.0.0.1</domain>
        <domain includeSubdomains="false">10.0.2.2</domain>${anchors}
    </domain-config>
</network-security-config>
"""
    }
}
preBuild.dependsOn 'debugNetworkConfig'

// MediaPipe Pose Landmarker 공식 모델 (android/ 시험 앱과 같은 모델, 약 9MB). 없을 때만 받음
def poseModelFile = file("$buildDir/generated/poseModel/pose_landmarker_full.task")
tasks.register('downloadPoseModel') {
    outputs.file(poseModelFile)
    doLast {
        if (poseModelFile.exists() && poseModelFile.length() > 1_000_000) return
        poseModelFile.parentFile.mkdirs()
        def url = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task'
        logger.lifecycle("자세 인식 모델 받는 중: $url")
        new URL(url).withInputStream { i -> poseModelFile.withOutputStream { it << i } }
        if (poseModelFile.length() < 1_000_000) throw new GradleException("자세 인식 모델을 받지 못했어요")
    }
}
preBuild.dependsOn 'downloadPoseModel'

// 배포용 빌드 전에 검사: 시험용 주소나 빠진 설정으로 APK 가 만들어지지 않게 함 (문제를 모두 모아 한 번에 알려 줌)
tasks.register('checkReleaseConfig') {
    doLast {
        def problems = []
        def configFile = file('src/main/assets/capacitor.config.json')
        def url = configFile.exists() ? new groovy.json.JsonSlurper().parse(configFile).server?.url : null
        def host = url ? new URI(url).host : null
        if (!url) {
            problems << "서버 주소가 없어요. FD_SERVER_URL=https://도메인/app/next/ npm run sync:release 를 먼저 실행해 주세요."
        } else if (!url.startsWith('https://')) {
            problems << "서버 주소가 HTTPS 가 아니에요 ($url). 배포용 앱은 HTTP 서버에 연결할 수 없어요."
        } else if (host in ['localhost', '127.0.0.1', '10.0.2.2']) {
            problems << "서버 주소가 이 PC 를 가리켜요 ($url). 실제 서버 도메인을 넣어 주세요."
        }
        def firebase = file('google-services.json')
        if (!firebase.exists()) {
            problems << "google-services.json 이 없어요. 없으면 푸시 알림이 동작하지 않아요 (mobile/android/app/ 에 넣어 주세요)."
        } else if (!firebase.text.contains('"com.humanfall.app"')) {
            problems << "google-services.json 이 이 앱(com.humanfall.app)의 설정이 아니에요."
        }
        def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !keystore[it] }
        if (!keystoreFile.exists()) {
            problems << "서명 설정 파일이 없어요 ($keystoreFile). mobile/RELEASE.md 를 봐 주세요."
        } else if (missing) {
            problems << "서명 설정에 빠진 값이 있어요: ${missing.join(', ')}"
        } else if (!file(keystore.storeFile).exists()) {
            problems << "서명 키 파일을 찾을 수 없어요 (${keystore.storeFile})."
        }
        if (problems) {
            throw new GradleException("배포용 빌드를 멈췄어요:\n - " + problems.join("\n - "))
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkReleaseConfig' }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 감지 기기 (detect/): 카메라 연속 프레임, 자세 인식·사람 영역 분리, 카메라를 쓰는 포그라운드 서비스
    implementation "androidx.camera:camera-core:1.4.2"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.lifecycle:lifecycle-service:2.6.2"
    implementation "com.google.mediapipe:tasks-vision:1.1.0"
    // 가족 휴대폰 푸시 알림 (push/): Firebase Cloud Messaging. 설정 파일 google-services.json 은 저장소에 두지 않음
    implementation platform("com.google.firebase:firebase-bom:35.1.0")
    implementation "com.google.firebase:firebase-messaging"
    testImplementation "junit:junit:$junitVersion"
    // PC 에서 도는 단위 시험용 (안드로이드의 org.json 은 PC 시험에서 동작하지 않음)
    testImplementation "org.json:json:20260814"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
