<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>낙상 안심</title>
  <meta name="theme-color" content="#0b57d0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- 색과 크기는 theme.css, 공통 모양은 base.css -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <!-- 사고 대응 레이어를 잠시 숨겼을 때 보이는 알림 줄 (js/incident/layer.js) -->
  <div id="incident-banner" class="incident-banner" role="status" hidden></div>
  <!-- 앱 전체 안내 줄: 로그인 필요, 서버 연결 끊김 (js/app.js) -->
  <div id="global-notice" class="notice global-notice" role="alert" hidden></div>
  <!-- 화면(홈/낙상 예방/낙상 감지/생활 관리/설정)이 이 안에 그려집니다 (js/screens/) -->
  <main id="screen" class="screen" tabindex="-1" aria-live="polite"></main>
  <!-- 하단 메뉴 (js/router.js) -->
  <nav id="nav" class="bottom-nav" aria-label="화면 이동" hidden></nav>
  <!-- 사고 대응 레이어: 확인이 필요한 낙상이 있으면 어느 메뉴에서든 맨 위에 뜸 (js/incident/) -->
  <div id="incident" class="incident-layer" role="dialog" aria-modal="true" aria-labelledby="incident-title" tabindex="-1" hidden></div>
  <!-- 앱 시작점 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
