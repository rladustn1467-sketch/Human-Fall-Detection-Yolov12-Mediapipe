<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>개발 확인 콘솔</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <style>
    :root { --ink:#1b2a30; --line:#d9dde0; --pri:#1b6a72; --red:#c42f2a; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; color:var(--ink); background:#eef0f1; }
    header { background:#1b2a30; color:#fff; padding:12px 20px; display:flex; align-items:center; gap:12px; }
    header h1 { font-size:16px; margin:0; }
    header small { opacity:.7; }
    main { display:grid; grid-template-columns: 360px 1fr; gap:16px; padding:16px; align-items:start; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section.panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
    h2 { font-size:13px; margin:0 0 10px; color:#51636a; letter-spacing:.02em; }
    label { display:block; font-size:12px; font-weight:700; color:#51636a; margin:8px 0 4px; }
    select, input[type=text] { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
    button { font:inherit; font-weight:700; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
    button:hover { background:#f4f6f7; }
    button.pri { background:var(--pri); color:#fff; border-color:var(--pri); }
    button.red { background:var(--red); color:#fff; border-color:var(--red); }
    button.on { background:#1b2a30; color:#fff; border-color:#1b2a30; }
    .row { display:flex; gap:6px; flex-wrap:wrap; }
    .row > * { flex:1 1 auto; }
    pre { margin:0; background:#12202a; color:#d6e6ea; border-radius:10px; padding:12px; font:12px/1.5 ui-monospace,Menlo,monospace; overflow:auto; max-height:320px; }
    .clock { font:700 20px ui-monospace,Menlo,monospace; }
    .frames { display:grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap:14px; }
    .frame { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .frame h3 { margin:0; padding:8px 12px; font-size:13px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
    .frame iframe { width:100%; height:720px; border:0; display:block; background:#f4f1ea; }
    .inc { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; }
    .inc b { color:var(--red); }
  </style>
</head>
<body>
  <header><i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i><h1>개발 확인 콘솔</h1><small>낙상 이벤트 · 사용자 전환 · 타이머 배속</small></header>
  <main>
    <div>
      <section class="panel" aria-labelledby="h-fall">
        <h2 id="h-fall">낙상 이벤트 발생</h2>
        <label for="f-home">집</label><select id="f-home"></select>
        <label for="f-loc">기기 위치</label><select id="f-loc"></select>
        <label for="f-rec">시스템이 인식한 대상자</label><select id="f-rec"></select>
        <div class="row" style="margin-top:12px"><button class="red" id="btn-fall">낙상 발생시키기</button><button id="btn-clear">사고 모두 지우기</button></div>
      </section>
      <section class="panel" aria-labelledby="h-user">
        <h2 id="h-user">현재 사용자 (앱 탭)</h2>
        <div class="row" id="users"></div>
        <p style="margin:10px 0 0;color:#51636a;font-size:12px">다른 브라우저 탭의 앱 화면은 이 선택에 따라 즉시 전환돼요. 오른쪽에서는 여러 사용자를 동시에 볼 수 있어요.</p>
      </section>
      <section class="panel" aria-labelledby="h-time">
        <h2 id="h-time">타이머</h2>
        <div class="clock" id="clock">--</div>
        <div class="row" style="margin-top:10px" id="speeds"></div>
        <div class="row" style="margin-top:8px"><button data-skip="30000">+30초</button><button data-skip="60000">+1분</button><button data-skip="300000">+5분</button></div>
      </section>
      <section class="panel" aria-labelledby="h-inc">
        <h2 id="h-inc">사고 상태</h2><div id="incs"></div>
        <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700">상태 객체 (JSON)</summary><pre id="json"></pre></details>
      </section>
      <section class="panel"><h2>초기화</h2><button id="btn-reset">임시 데이터 처음 상태로</button>
        <p style="margin:10px 0 0"><a href="index.html?mode=test" target="_blank" rel="noopener">앱 새 탭에서 열기 (테스트 모드)</a></p></section>
    </div>
    <div>
      <section class="panel"><h2>사용자별 동시 보기 <span style="font-weight:400">(같은 사고 상태를 공유)</span></h2>
        <div class="row" id="frame-pick"></div></section>
      <div class="frames" id="frames"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <!-- 개발 확인 콘솔은 항상 테스트 모드 (예시 데이터만, 서버 API 호출 없음) -->
  <script src="js/mode.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/dev.js"></script>
</body>
</html>
